<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><title id="t">THE HUMAN FIREWALL</title><desc id="d">Twelve chambers classified by what they are permitted to do. Five are firewalled so that the action leaves the machine and reaches a person.</desc><rect width="1180" height="760" fill="#0B1015"/><text x="48" y="56" font-size="26" fill="#F3F7F9" text-anchor="start" font-weight="700" letter-spacing="1.5">THE HUMAN FIREWALL</text><text x="48" y="84" font-size="15" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">Five of twelve chambers hand off to a person. Not because the model is weak — because being wrong there hurts someone specific.</text><text x="70" y="124" font-size="11" fill="#A7B6C2" text-anchor="start" font-weight="700" letter-spacing="1">CH</text><text x="112" y="124" font-size="11" fill="#A7B6C2" text-anchor="start" font-weight="700" letter-spacing="1">CHAMBER</text><text x="560" y="124" font-size="11" fill="#A7B6C2" text-anchor="start" font-weight="700" letter-spacing="1">GROUP</text><text x="730" y="124" font-size="11" fill="#A7B6C2" text-anchor="start" font-weight="700" letter-spacing="1">CLASS</text><text x="850" y="124" font-size="11" fill="#A7B6C2" text-anchor="start" font-weight="700" letter-spacing="1">WHERE THE ACTION ENDS</text><rect x="56" y="138" width="1068" height="38" rx="8" fill="#161E27" stroke="#33424F" stroke-width="1.2"/><text x="74" y="163" font-size="14" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">01</text><text x="112" y="163" font-size="13.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">Base Rates &amp; Diagnostic Accuracy</text><text x="560" y="163" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">MEASUREMENT</text><text x="730" y="163" font-size="12" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">K</text><text x="850" y="163" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">the machine answers</text><rect x="56" y="182" width="1068" height="38" rx="8" fill="#161E27" stroke="#33424F" stroke-width="1.2"/><text x="74" y="207" font-size="14" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">02</text><text x="112" y="207" font-size="13.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">Synthetic Actor Detection</text><text x="560" y="207" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">LENS</text><text x="730" y="207" font-size="12" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">K</text><text x="850" y="207" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">the machine answers</text><rect x="56" y="226" width="1068" height="38" rx="8" fill="#161E27" stroke="#33424F" stroke-width="1.2"/><text x="74" y="251" font-size="14" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">03</text><text x="112" y="251" font-size="13.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">Administrative Burden &amp; Benefits</text><text x="560" y="251" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">DOMAIN</text><text x="730" y="251" font-size="12" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">K+R</text><text x="850" y="251" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">the machine answers</text><rect x="56" y="270" width="1068" height="38" rx="8" fill="#2A1B22" stroke="#FB7185" stroke-width="2"/><text x="74" y="295" font-size="14" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">04</text><text x="112" y="295" font-size="13.5" fill="#FB7185" text-anchor="start" font-weight="600" letter-spacing="0">Legal-Aid Navigation</text><text x="560" y="295" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">DOMAIN</text><text x="730" y="295" font-size="12" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">K+R HIGH</text><text x="850" y="295" font-size="12.5" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">A PERSON</text><circle cx="1092" cy="289" r="9" fill="none" stroke="#FB7185" stroke-width="1.8"/><path d="M 1087 300 q 5 -8 10 0" fill="none" stroke="#FB7185" stroke-width="1.8"/><rect x="56" y="314" width="1068" height="38" rx="8" fill="#2A1B22" stroke="#FB7185" stroke-width="2"/><text x="74" y="339" font-size="14" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">05</text><text x="112" y="339" font-size="13.5" fill="#FB7185" text-anchor="start" font-weight="600" letter-spacing="0">Consumer Debt &amp; Coercion</text><text x="560" y="339" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">DOMAIN</text><text x="730" y="339" font-size="12" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">K+R HIGH</text><text x="850" y="339" font-size="12.5" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">A PERSON</text><circle cx="1092" cy="333" r="9" fill="none" stroke="#FB7185" stroke-width="1.8"/><path d="M 1087 344 q 5 -8 10 0" fill="none" stroke="#FB7185" stroke-width="1.8"/><rect x="56" y="358" width="1068" height="38" rx="8" fill="#161E27" stroke="#33424F" stroke-width="1.2"/><text x="74" y="383" font-size="14" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">06</text><text x="112" y="383" font-size="13.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">Fraud &amp; Scam Typology</text><text x="560" y="383" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">DOMAIN</text><text x="730" y="383" font-size="12" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">K</text><text x="850" y="383" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">the machine answers</text><rect x="56" y="402" width="1068" height="38" rx="8" fill="#2A1B22" stroke="#FB7185" stroke-width="2"/><text x="74" y="427" font-size="14" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">07</text><text x="112" y="427" font-size="13.5" fill="#FB7185" text-anchor="start" font-weight="600" letter-spacing="0">Counter-Exploitation</text><text x="560" y="427" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">ROUTING</text><text x="730" y="427" font-size="12" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">K+R HIGH</text><text x="850" y="427" font-size="12.5" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">A PERSON</text><circle cx="1092" cy="421" r="9" fill="none" stroke="#FB7185" stroke-width="1.8"/><path d="M 1087 432 q 5 -8 10 0" fill="none" stroke="#FB7185" stroke-width="1.8"/><rect x="56" y="446" width="1068" height="38" rx="8" fill="#2A1B22" stroke="#FB7185" stroke-width="2"/><text x="74" y="471" font-size="14" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">08</text><text x="112" y="471" font-size="13.5" fill="#FB7185" text-anchor="start" font-weight="600" letter-spacing="0">At-Risk Digital Safety</text><text x="560" y="471" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">ROUTING</text><text x="730" y="471" font-size="12" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">K+R HIGH</text><text x="850" y="471" font-size="12.5" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">A PERSON</text><circle cx="1092" cy="465" r="9" fill="none" stroke="#FB7185" stroke-width="1.8"/><path d="M 1087 476 q 5 -8 10 0" fill="none" stroke="#FB7185" stroke-width="1.8"/><rect x="56" y="490" width="1068" height="38" rx="8" fill="#161E27" stroke="#33424F" stroke-width="1.2"/><text x="74" y="515" font-size="14" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">09</text><text x="112" y="515" font-size="13.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">Plain Language &amp; Info Design</text><text x="560" y="515" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">DELIVERY</text><text x="730" y="515" font-size="12" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">K</text><text x="850" y="515" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">the machine answers</text><rect x="56" y="534" width="1068" height="38" rx="8" fill="#161E27" stroke="#33424F" stroke-width="1.2"/><text x="74" y="559" font-size="14" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">10</text><text x="112" y="559" font-size="13.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">Resource Verification</text><text x="560" y="559" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">DELIVERY</text><text x="730" y="559" font-size="12" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">K</text><text x="850" y="559" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">the machine answers</text><rect x="56" y="578" width="1068" height="38" rx="8" fill="#161E27" stroke="#33424F" stroke-width="1.2"/><text x="74" y="603" font-size="14" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">11</text><text x="112" y="603" font-size="13.5" fill="#F3F7F9" text-anchor="start" font-weight="400" letter-spacing="0">Multilingual &amp; Language Access</text><text x="560" y="603" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">DELIVERY</text><text x="730" y="603" font-size="12" fill="#2DD4E8" text-anchor="start" font-weight="700" letter-spacing="0">K+R</text><text x="850" y="603" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">the machine answers</text><rect x="56" y="622" width="1068" height="38" rx="8" fill="#2A1B22" stroke="#FB7185" stroke-width="2"/><text x="74" y="647" font-size="14" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">12</text><text x="112" y="647" font-size="13.5" fill="#FB7185" text-anchor="start" font-weight="600" letter-spacing="0">Crisis Comms &amp; Harm Reduction</text><text x="560" y="647" font-size="11.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0.6">DELIVERY</text><text x="730" y="647" font-size="12" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">K+R HIGH</text><text x="850" y="647" font-size="12.5" fill="#FB7185" text-anchor="start" font-weight="700" letter-spacing="0">A PERSON</text><circle cx="1092" cy="641" r="9" fill="none" stroke="#FB7185" stroke-width="1.8"/><path d="M 1087 652 q 5 -8 10 0" fill="none" stroke="#FB7185" stroke-width="1.8"/><rect x="48" y="676" width="1084" height="64" rx="14" fill="#161E27" stroke="#33424F" stroke-width="1.5"/><text x="70" y="708" font-size="13" fill="#F3F7F9" text-anchor="start" font-weight="600" letter-spacing="0">5 K-only   ·   7 K+R   ·   5 flagged HIGH   ·   checksum 78 = triangular(12)   —  every figure independently recounted, all ten hold</text><text x="70" y="730" font-size="12.5" fill="#A7B6C2" text-anchor="start" font-weight="400" letter-spacing="0">A control that routes to a human only works if the human is actually reachable. That is a staffing fact, not a code fact.</text></svg>